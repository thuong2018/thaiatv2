<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Thái Ất - Radar Rọi Tương Lai</title>
<style>
  :root {
    --gold: #c9a227;
    --gold-light: #f0d060;
    --gold-dim: #8a6e15;
    --deep: #0a0614;
    --deep2: #13092a;
    --deep3: #1e1040;
    --text: #e8d8a0;
    --text-muted: #9980c0;
    --border: rgba(201,162,39,0.25);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--deep);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
  }
  body { padding: 0 0 2rem; }

  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(100,60,200,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(60,30,120,0.08) 0%, transparent 60%);
  }

  .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .header {
    text-align: center;
    padding: 2rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .header-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .header h1 {
    font-size: 1.4rem;
    font-weight: normal;
    letter-spacing: 0.08em;
    color: var(--gold-light);
    margin-bottom: 0.25rem;
  }
  .header p {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .form-card {
    background: var(--deep2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  .form-title {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
  }

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .input-group label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .input-group input {
    width: 100%;
    background: var(--deep3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1.1rem;
    font-family: 'Georgia', serif;
    padding: 10px 12px;
    text-align: center;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
  }
  .input-group input:focus {
    border-color: var(--gold-dim);
    background: rgba(30,16,64,0.9);
  }

  .btn {
    width: 100%;
    background: linear-gradient(135deg, #7c4f00, var(--gold), #7c4f00);
    background-size: 200% 100%;
    color: #1a0e00;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.08em;
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    margin-top: 6px;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.75; }

  .result-block {
    background: var(--deep2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .result-header {
    background: rgba(201,162,39,0.08);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-header .ricon { font-size: 1.1rem; }
  .result-header .rtitle {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    flex: 1;
  }
  .result-header .rbadge {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    background: rgba(201,162,39,0.15);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 9px;
    color: var(--gold-light);
  }

  .result-body { padding: 12px 14px; }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 1px solid rgba(201,162,39,0.08);
    font-size: 0.85rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-muted); }
  .stat-value { color: var(--gold-light); font-size: 0.9rem; }

  .verdict-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(201,162,39,0.08);
    font-size: 0.82rem;
    gap: 8px;
  }
  .verdict-row:last-child { border-bottom: none; }
  .vd-label { color: var(--text-muted); flex: 1; }
  .vd-cung { color: var(--text); min-width: 80px; text-align: center; font-size: 0.78rem; }
  .vd-verdict { font-size: 0.78rem; padding: 2px 8px; border-radius: 20px; }
  .vd-phat { background: rgba(60,180,60,0.15); color: #7fdd7f; border: 1px solid rgba(60,180,60,0.3); }
  .vd-do   { background: rgba(200,30,30,0.15); color: #f08080; border: 1px solid rgba(200,30,30,0.3); }
  .vd-tu   { background: rgba(150,100,0,0.15); color: #f0c060; border: 1px solid rgba(150,100,0,0.3); }
  .vd-yem  { background: rgba(180,30,180,0.15); color: #e080e0; border: 1px solid rgba(180,30,180,0.3); }
  .vd-cach { background: rgba(60,60,180,0.15); color: #80a0f0; border: 1px solid rgba(60,60,180,0.3); }

  .section-divider {
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 1.5rem 0 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-divider::before, .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .toan-row {
    display: flex;
    gap: 8px;
    margin: 8px 0 4px;
  }
  .toan-chip {
    flex: 1;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    background: var(--deep3);
    border: 1px solid var(--border);
  }
  .toan-chip .tc-label { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
  .toan-chip .tc-value { font-size: 1.2rem; color: var(--gold-light); }

  .spinner { display: none; text-align: center; padding: 1.5rem 0; color: var(--text-muted); font-size: 0.9rem; }
  .spinner.active { display: block; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  .spinner span { animation: pulse 1.5s ease-in-out infinite; }

  #results { display: none; }
  #results.active { display: block; }
  #error-msg { display: none; color: #f08080; font-size: 0.85rem; margin-top: 8px; text-align: center; padding: 8px; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">

  <div class="header">
    <div class="header-icon">🌌</div>
    <h1>THÁI ẤT THẦN KINH</h1>
    <p>Radar Rọi Tương Lai</p>
  </div>

  <div class="form-card">
    <div class="form-title">Nhập thời điểm cần xem</div>
    <div class="input-grid">
      <div class="input-group">
        <label>Năm</label>
        <input type="number" id="nam" placeholder="2026" min="1" max="9999" inputmode="numeric">
      </div>
      <div class="input-group">
        <label>Tháng</label>
        <input type="number" id="thang" placeholder="5" min="1" max="12" inputmode="numeric">
      </div>
      <div class="input-group">
        <label>Ngày</label>
        <input type="number" id="ngay" placeholder="14" min="1" max="31" inputmode="numeric">
      </div>
      <div class="input-group">
        <label>Giờ</label>
        <input type="number" id="gio" placeholder="12" min="0" max="23" inputmode="numeric">
      </div>
    </div>
    <button class="btn" onclick="calculate()">⊛ SOI CHIẾU 4 TẦNG THÁI ẤT</button>
    <div id="error-msg"></div>
  </div>

  <div class="spinner" id="spinner"><span>✦ Đang tính toán thiên cơ ✦</span></div>

  <div id="results"></div>

</div>

<script>
const CUNG_HANH = {
  1:["Càn","Kim"], 6:["Đoài","Kim"],
  4:["Chấn","Mộc"], 9:["Tốn","Mộc"],
  8:["Khảm","Thủy"], 2:["Ly","Hỏa"],
  3:["Cấn","Thổ"], 7:["Khôn","Thổ"], 5:["Trung Cung","Thổ"]
};

const THAN_INFO = {
  "Tuất":[1,"1st"],"Càn":[1,"2nd"],"Hợi":[1,"3rd"],"Sửu":[3,"1st"],"Cấn":[3,"2nd"],"Dần":[3,"3rd"],
  "Thìn":[9,"1st"],"Tốn":[9,"2nd"],"Tỵ":[9,"3rd"],"Mùi":[7,"1st"],"Khôn":[7,"2nd"],"Thân":[7,"3rd"],
  "Tý":[8,"2nd"],"Mão":[4,"2nd"],"Ngọ":[2,"2nd"],"Dậu":[6,"2nd"]
};

const THAP_LUC_THAN = ["Càn","Hợi","Tý","Sửu","Cấn","Dần","Mão","Thìn","Tốn","Tỵ","Ngọ","Mùi","Khôn","Thân","Dậu","Tuất"];
const DUONG_PALACES = [1,2,3,4,6,7,8,9];
const LAC_THU = [1,8,3,4,9,2,7,6];
const MAP_CUNG_IDX = {1:0,8:1,3:2,4:3,9:4,2:5,7:6,6:7};

const VX_DUONG={1:"Thân",2:"Dậu",3:"Tuất",4:"Càn",5:"Càn",6:"Hợi",7:"Tý",8:"Sửu",9:"Cấn",10:"Dần",11:"Mão",12:"Thìn",13:"Tốn",14:"Tỵ",15:"Ngọ",16:"Mùi",17:"Khôn",0:"Khôn"};
const VX_AM={1:"Dần",2:"Mão",3:"Thìn",4:"Tốn",5:"Tốn",6:"Tỵ",7:"Ngọ",8:"Mùi",9:"Khôn",10:"Thân",11:"Dậu",12:"Tuất",13:"Càn",14:"Hợi",15:"Tý",16:"Sửu",17:"Cấn",0:"Cấn"};
const KT_DUONG={1:"Dần",2:"Sửu",3:"Tý",4:"Hợi",5:"Tuất",6:"Dậu",7:"Thân",8:"Mùi",9:"Ngọ",10:"Tỵ",11:"Thìn",0:"Mão"};
const KT_AM={1:"Thân",2:"Mùi",3:"Ngọ",4:"Tỵ",5:"Thìn",6:"Mão",7:"Dần",8:"Sửu",9:"Tý",10:"Hợi",11:"Tuất",0:"Dậu"};

function tinhCucThaiAt(nam, thang, ngay, gio) {
  const tichSoNam = 10155509 + (nam - 1592);
  const tueCuc = (tichSoNam % 3600) % 72 || 72;

  const tichSoThang = (tichSoNam - 1) * 12 + (thang + 2);
  const nguyetCuc = (tichSoThang % 3600) % 72 || 72;

  const a = Math.floor((14 - thang) / 12);
  const y = nam + 4800 - a;
  const m = thang + 12 * a - 3;
  const jdn = ngay + Math.floor((153*m+2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
  const nhatCuc = (jdn + 50) % 72 || 72;

  const target = new Date(nam, thang-1, ngay);
  const base = new Date(2024, 2, 1);
  const diff = Math.round((target - base) / 86400000);
  const chiSoNgay = ((diff % 60) + 60) % 60;
  const N = (chiSoNgay % 30) + 1;
  const K = (((gio + 1) % 24) >> 1) + 1;
  const T = (N - 1) * 12 + K;
  const thoiCuc = T % 72 || 72;

  const dayOfYear = Math.floor((target - new Date(nam,0,0)) / 86400000);
  const loaiThoiDon = (dayOfYear >= 172 && dayOfYear <= 355) ? "am" : "duong";

  return [
    { ten:"🌍 TUẾ KẾ (VẬN NĂM)", so: tueCuc, don:"duong" },
    { ten:"🌙 NGUYỆT KẾ (VẬN THÁNG)", so: nguyetCuc, don:"duong" },
    { ten:"☀️ NHẬT KẾ (VẬN NGÀY)", so: nhatCuc, don:"duong" },
    { ten:"⏳ THỜI KẾ (VẬN GIỜ)", so: thoiCuc, don: loaiThoiDon }
  ];
}

function getCungInfo(num) {
  const ch = CUNG_HANH[num] || ["?","?"];
  return `Cung ${num} - ${ch[0]} (${ch[1]})`;
}

function demQuan(startThan, taPalace) {
  const [cungStart, loaiThanGiap] = THAN_INFO[startThan];
  if (cungStart === taPalace) return cungStart;
  let idx = MAP_CUNG_IDX[cungStart];
  const taIdx = MAP_CUNG_IDX[taPalace];
  let total = 0;
  if (loaiThanGiap === "1st" || loaiThanGiap === "3rd") {
    total += 1;
    if (loaiThanGiap === "1st") total += LAC_THU[idx];
  } else {
    total += LAC_THU[idx];
  }
  idx = (idx + 1) % 8;
  while (idx !== taIdx) { total += LAC_THU[idx]; idx = (idx+1)%8; }
  return total;
}

function tinhTuong(toan) {
  let dai = toan % 10 || 1;
  let tham = (dai * 3) % 10 || 1;
  return [dai, tham];
}

function phanXuAn(tuong, ta, tkCung) {
  if (tuong === 5) return ["☠️ ĐỖ","do"];
  if (tuong === ta) return ["⛓️ TÙ","tu"];
  if (tuong === tkCung) return ["🗡️ YỂM","yem"];
  const doi = {1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4};
  if (tuong === (doi[ta]||0)) return ["↔️ CÁCH","cach"];
  return ["🔥 PHÁT","phat"];
}

function lapSaBan(cuc) {
  const { ten, so: cucSo, don: loaiDon } = cuc;

  const roundCuc = (cucSo - 1) % 24;
  const idxTA = Math.floor(roundCuc / 3);
  const thaiAt = DUONG_PALACES[idxTA];

  const vanXuong = (loaiDon === "duong" ? VX_DUONG : VX_AM)[cucSo % 18];
  const keThan = (loaiDon === "duong" ? KT_DUONG : KT_AM)[cucSo % 12];

  const vxIdx = THAP_LUC_THAN.indexOf(vanXuong);
  const ktIdx = THAP_LUC_THAN.indexOf(keThan);
  const thuyKichIdx = (4 + (vxIdx - ktIdx) + 16) % 16;
  const thuyKich = THAP_LUC_THAN[thuyKichIdx];

  const cungTK = THAN_INFO[thuyKich][0];
  const toanChu = demQuan(vanXuong, thaiAt);
  const toanKhach = demQuan(thuyKich, thaiAt);
  const [chuDai, chuTham] = tinhTuong(toanChu);
  const [khachDai, khachTham] = tinhTuong(toanKhach);

  const [vdChuDaiText, vdChuDaiCls] = phanXuAn(chuDai, thaiAt, cungTK);
  const [vdChuThamText, vdChuThamCls] = phanXuAn(chuTham, thaiAt, cungTK);
  const [vdKhachDaiText, vdKhachDaiCls] = phanXuAn(khachDai, thaiAt, cungTK);
  const [vdKhachThamText, vdKhachThamCls] = phanXuAn(khachTham, thaiAt, cungTK);

  return {
    ten, cucSo, loaiDon, thaiAt, vanXuong, keThan, thuyKich,
    toanChu, toanKhach, chuDai, chuTham, khachDai, khachTham,
    vdChuDai:[vdChuDaiText,vdChuDaiCls], vdChuTham:[vdChuThamText,vdChuThamCls],
    vdKhachDai:[vdKhachDaiText,vdKhachDaiCls], vdKhachTham:[vdKhachThamText,vdKhachThamCls]
  };
}

const ICONS = {"🌍 TUẾ KẾ (VẬN NĂM)":"🌍","🌙 NGUYỆT KẾ (VẬN THÁNG)":"🌙","☀️ NHẬT KẾ (VẬN NGÀY)":"☀️","⏳ THỜI KẾ (VẬN GIỜ)":"⏳"};
const SHORT = {"🌍 TUẾ KẾ (VẬN NĂM)":"VẬN NĂM","🌙 NGUYỆT KẾ (VẬN THÁNG)":"VẬN THÁNG","☀️ NHẬT KẾ (VẬN NGÀY)":"VẬN NGÀY","⏳ THỜI KẾ (VẬN GIỜ)":"VẬN GIỜ"};

function renderResult(r) {
  const donLabel = r.loaiDon === "duong" ? "DƯƠNG ĐỘN" : "ÂM ĐỘN";
  return `
  <div class="result-block">
    <div class="result-header">
      <span class="ricon">${ICONS[r.ten]||"🔮"}</span>
      <span class="rtitle">${SHORT[r.ten]||r.ten}</span>
      <span class="rbadge">Cục ${r.cucSo} · ${donLabel}</span>
    </div>
    <div class="result-body">
      <div class="stat-row">
        <span class="stat-label">⭐ Thái Ất (Mộc)</span>
        <span class="stat-value">${getCungInfo(r.thaiAt)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">👁️ Văn Xương (Thổ)</span>
        <span class="stat-value">${r.vanXuong} · ${getCungInfo(THAN_INFO[r.vanXuong][0])}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">🌊 Thủy Kích (Hỏa)</span>
        <span class="stat-value">${r.thuyKich} · ${getCungInfo(THAN_INFO[r.thuyKich][0])}</span>
      </div>

      <div class="toan-row">
        <div class="toan-chip">
          <div class="tc-label">🔴 Chủ</div>
          <div class="tc-value">${r.toanChu}</div>
        </div>
        <div class="toan-chip">
          <div class="tc-label">🟢 Khách</div>
          <div class="tc-value">${r.toanKhach}</div>
        </div>
      </div>

      <div class="section-divider">Quân lực bên Chủ (Bán)</div>
      <div class="verdict-row">
        <span class="vd-label">Đại Tướng (Thủy)</span>
        <span class="vd-cung">${getCungInfo(r.chuDai)}</span>
        <span class="vd-verdict vd-${r.vdChuDai[1]}">${r.vdChuDai[0]}</span>
      </div>
      <div class="verdict-row">
        <span class="vd-label">Tham Tướng (Mộc)</span>
        <span class="vd-cung">${getCungInfo(r.chuTham)}</span>
        <span class="vd-verdict vd-${r.vdChuTham[1]}">${r.vdChuTham[0]}</span>
      </div>

      <div class="section-divider">Quân lực bên Khách (Mua)</div>
      <div class="verdict-row">
        <span class="vd-label">Đại Tướng (Kim)</span>
        <span class="vd-cung">${getCungInfo(r.khachDai)}</span>
        <span class="vd-verdict vd-${r.vdKhachDai[1]}">${r.vdKhachDai[0]}</span>
      </div>
      <div class="verdict-row">
        <span class="vd-label">Tham Tướng (Thủy)</span>
        <span class="vd-cung">${getCungInfo(r.khachTham)}</span>
        <span class="vd-verdict vd-${r.vdKhachTham[1]}">${r.vdKhachTham[0]}</span>
      </div>
    </div>
  </div>`;
}

function setError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function calculate() {
  setError('');
  const nam = parseInt(document.getElementById('nam').value);
  const thang = parseInt(document.getElementById('thang').value);
  const ngay = parseInt(document.getElementById('ngay').value);
  const gio = parseInt(document.getElementById('gio').value);

  if (!nam || !thang || !ngay || isNaN(gio)) { setError('⚠️ Vui lòng nhập đủ Năm, Tháng, Ngày, Giờ'); return; }
  if (thang < 1 || thang > 12) { setError('⚠️ Tháng phải từ 1–12'); return; }
  if (ngay < 1 || ngay > 31) { setError('⚠️ Ngày phải từ 1–31'); return; }
  if (gio < 0 || gio > 23) { setError('⚠️ Giờ phải từ 0–23'); return; }

  const spinner = document.getElementById('spinner');
  const resultsEl = document.getElementById('results');
  spinner.classList.add('active');
  resultsEl.classList.remove('active');
  resultsEl.innerHTML = '';

  setTimeout(() => {
    try {
      const cucs = tinhCucThaiAt(nam, thang, ngay, gio);
      const html = cucs.map(c => renderResult(lapSaBan(c))).join('');
      resultsEl.innerHTML = html;
      resultsEl.classList.add('active');
    } catch(e) {
      setError('⚠️ Thiên cơ nhiễu loạn: ' + e.message);
    }
    spinner.classList.remove('active');
  }, 400);
}

// Pre-fill today
(function() {
  const now = new Date();
  document.getElementById('nam').value = now.getFullYear();
  document.getElementById('thang').value = now.getMonth()+1;
  document.getElementById('ngay').value = now.getDate();
  document.getElementById('gio').value = now.getHours();
})();
</script>
</body>
</html>
