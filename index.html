<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Radar Thái Ất Quant</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:        #06060e;
  --bg2:       #0c0c1e;
  --gold:      #c8a84b;
  --gold2:     #f0d080;
  --red:       #e05050;
  --green:     #50c878;
  --gray:      #888;
  --border:    rgba(200,168,75,0.25);
  --glow:      rgba(200,168,75,0.15);
  --text:      #d8d0c0;
  --dim:       #7a7060;
}

*{box-sizing:border-box;margin:0;padding:0}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Cosmic BG ── */
body::before {
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(100,60,200,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 85%, rgba(200,120,30,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(20,10,60,0.6) 0%, transparent 100%);
  pointer-events:none;z-index:0;
}

/* Starfield */
.stars {
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,200,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 55%, rgba(255,220,150,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 85%, rgba(200,180,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 8%  50%, rgba(255,255,200,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 33% 5%,  rgba(200,230,255,0.5) 0%, transparent 100%);
}

/* ── Layout ── */
.wrap {
  position:relative;z-index:1;
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

/* ── Header ── */
header {
  text-align:center;
  padding: 2.5rem 0 1.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2.5rem;
  position: relative;
}

.octagram {
  font-size: 2.8rem;
  line-height:1;
  margin-bottom: 0.6rem;
  display:block;
  filter: drop-shadow(0 0 12px var(--gold));
  animation: pulse-glow 3s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%,100%{filter:drop-shadow(0 0 10px var(--gold))}
  50%{filter:drop-shadow(0 0 22px var(--gold2))}
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.3rem, 4vw, 2rem);
  font-weight: 900;
  letter-spacing: .08em;
  background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 50%, #a07830 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  line-height: 1.2;
  margin-bottom: .35rem;
}

.subtitle {
  font-family: 'Share Tech Mono', monospace;
  font-size: .75rem;
  color: var(--dim);
  letter-spacing: .2em;
  text-transform: uppercase;
}

/* ── Control Panel ── */
.controls {
  background: linear-gradient(135deg, rgba(200,168,75,0.06) 0%, rgba(20,15,50,0.5) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 1rem;
  align-items: end;
}

@media(max-width:600px){
  .controls{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
  .controls .btn-run{grid-column:1/-1;}
}

.field label {
  display:block;
  font-family:'Share Tech Mono',monospace;
  font-size:.7rem;
  letter-spacing:.15em;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:.5rem;
}

.field select, .field input[type="date"] {
  width:100%;
  background: rgba(10,8,30,0.7);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: .85rem;
  padding: .55rem .8rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

.field select:focus, .field input[type="date"]:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(200,168,75,0.15);
}

.field select option{background:#0c0c1e;}

/* Week range display */
.week-info {
  grid-column: 1/-1;
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}

.week-chip {
  font-family:'Share Tech Mono',monospace;
  font-size:.72rem;
  padding:.28rem .65rem;
  border-radius:20px;
  border:1px solid var(--border);
  background: rgba(200,168,75,0.06);
  color:var(--dim);
  cursor:pointer;
  transition:all .2s;
  white-space:nowrap;
}
.week-chip:hover,.week-chip.active{
  border-color:var(--gold);color:var(--gold);
  background:rgba(200,168,75,0.12);
}

.btn-run {
  background: linear-gradient(135deg, #a07830 0%, var(--gold) 50%, #c8a84b 100%);
  color: #06060e;
  font-family: 'Cinzel Decorative', serif;
  font-size: .8rem;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  padding: .65rem 1.4rem;
  cursor: pointer;
  letter-spacing: .08em;
  transition: transform .15s, box-shadow .15s, filter .2s;
  box-shadow: 0 4px 20px rgba(200,168,75,0.35);
  white-space:nowrap;
}
.btn-run:hover{transform:translateY(-2px);box-shadow:0 7px 28px rgba(200,168,75,0.5);filter:brightness(1.1)}
.btn-run:active{transform:translateY(0)}

/* ── Results ── */
#results { display:flex; flex-direction:column; gap:1.4rem; }

.day-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(12,10,35,0.85) 0%, rgba(8,6,20,0.9) 100%);
  overflow: hidden;
  animation: fadeUp .35s ease both;
  transition: box-shadow .3s;
}
.day-card:hover{box-shadow:0 0 30px rgba(200,168,75,0.1)}

@keyframes fadeUp {
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.card-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: rgba(200,168,75,0.06);
  border-bottom: 1px solid var(--border);
}

.card-date {
  font-family: 'Cinzel Decorative', serif;
  font-size: .95rem;
  color: var(--gold);
  flex:1;
}
.card-can-chi {
  font-family:'Share Tech Mono',monospace;
  font-size:.72rem;
  color:var(--dim);
  letter-spacing:.1em;
}

.card-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

@media(max-width:580px){.card-body{grid-template-columns:1fr;}}

.asset-block {
  padding: 1.1rem 1.25rem;
}
.asset-block:first-child{border-right:1px solid var(--border);}

.asset-label {
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;
  letter-spacing:.2em;
  color:var(--dim);
  text-transform:uppercase;
  margin-bottom:.5rem;
}

.signal-badge {
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  font-size:.82rem;
  font-weight:600;
  font-family:'Share Tech Mono',monospace;
  padding:.3rem .7rem;
  border-radius:5px;
  margin-bottom:.55rem;
  letter-spacing:.05em;
}
.signal-long  {background:rgba(80,200,120,0.15);color:var(--green);border:1px solid rgba(80,200,120,0.3)}
.signal-short {background:rgba(224,80,80,0.15);color:var(--red);border:1px solid rgba(224,80,80,0.25)}
.signal-none  {background:rgba(100,100,100,0.1);color:var(--gray);border:1px solid rgba(100,100,100,0.2)}

.signal-reason {
  font-size:.75rem;
  color:#9090a0;
  line-height:1.5;
}

/* Stats row */
.stats-row {
  display:flex;
  gap:.4rem;
  flex-wrap:wrap;
  padding: .75rem 1.25rem;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}

.stat-pill {
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;
  color:var(--dim);
  padding:.18rem .55rem;
  border:1px solid rgba(200,168,75,0.12);
  border-radius:3px;
  background:rgba(200,168,75,0.04);
}
.stat-pill b{color:var(--gold);}

/* An phat chips */
.an-chip {
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:.6rem;
  padding:.12rem .4rem;
  border-radius:3px;
  margin:.1rem;
  background:rgba(224,80,80,0.12);
  color:#e07070;
  border:1px solid rgba(224,80,80,0.2);
}

/* Volume badge */
.vol-bull{color:var(--green)} .vol-bear{color:var(--red)} .vol-neut{color:var(--gray)}

/* Loading */
#loading {
  text-align:center;
  padding:2rem;
  font-family:'Share Tech Mono',monospace;
  color:var(--dim);
  font-size:.85rem;
  display:none;
}
.spinner {
  width:28px;height:28px;
  border:2px solid rgba(200,168,75,0.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto .8rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
#empty {
  text-align:center;
  padding:3rem 1rem;
  color:var(--dim);
  font-family:'Share Tech Mono',monospace;
  font-size:.8rem;
  letter-spacing:.1em;
}
.empty-icon{font-size:2.5rem;margin-bottom:.8rem;opacity:.4;}

/* Footer */
footer{
  text-align:center;
  margin-top:3rem;
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;
  color:var(--dim);
  letter-spacing:.15em;
  border-top:1px solid var(--border);
  padding-top:1.5rem;
}
</style>
</head>
<body>
<div class="stars"></div>

<div class="wrap">

<!-- HEADER -->
<header>
  <span class="octagram">☯</span>
  <h1>Radar Thái Ất Quant</h1>
  <p class="subtitle">BTC · XAU &nbsp;|&nbsp; Signal Scanner &nbsp;|&nbsp; Nhật Cục</p>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="field">
    <label>📅 Ngày bắt đầu</label>
    <input type="date" id="startDate"/>
  </div>
  <div class="field">
    <label>🎯 Tài sản</label>
    <select id="assetSelect">
      <option value="BOTH">BTC + XAU</option>
      <option value="BTC">BTC only</option>
      <option value="XAU">XAU only</option>
    </select>
  </div>
  <button class="btn-run" onclick="runScan()">QUÉT KÈO ▶</button>

  <div class="week-info" id="weekChips">
    <!-- JS fills chips -->
  </div>
</div>

<!-- RESULTS -->
<div id="loading"><div class="spinner"></div>Đang giải sa bàn...</div>
<div id="empty">
  <div class="empty-icon">☰</div>
  Chọn ngày và nhấn QUÉT KÈO để bắt đầu
</div>
<div id="results"></div>

<footer>THÁI ẤT QUANT &nbsp;·&nbsp; DỰA TRÊN THUẬT TOÁN NHẬT CỤC &nbsp;·&nbsp; KHÔNG PHẢI TƯ VẤN ĐẦU TƯ</footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   PORT THUẬT TOÁN THÁI ẤT NHẬT CỤC → JavaScript
   (Based on thai_at_core.py logic)
   ══════════════════════════════════════════════════════════════════ */

// ── Bảng Can Chi ──────────────────────────────────────────────────
const CAN  = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
const CHI  = ["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];

// ── Các cung Thái Ất (9 cung Lạc Thư) ─────────────────────────────
const THAI_AT_TUONG = [
  "Thiên Mục","Địa Mục","Nhân Mục",
  "Thắng Quang","Thắng Quang","Thái Ất",
  "Thiên Ất","Địa Ất","Nhân Ất"
];

// ── Bảng Án Phạt theo cung Tướng ──────────────────────────────────
// Mô phỏng logic án phạt từ thai_at_core.py
const AN_PHAT_TABLE = {
  "Thiên Mục": { 1:["QUAN"],2:[],3:["TÙ"],4:[],5:["QUAN","TÙ"],6:[],7:["QUAN"],8:[],9:["TÙ"] },
  "Địa Mục":   { 1:[],2:["TÙ"],3:[],4:["QUAN"],5:["TÙ"],6:["QUAN"],7:[],8:["TÙ"],9:[] },
  "Nhân Mục":  { 1:["TÙ"],2:[],3:["QUAN"],4:[],5:[],6:["TÙ"],7:[],8:["QUAN"],9:[] },
  "Thắng Quang":{ 1:["QUAN"],2:["TÙ"],3:[],4:["QUAN"],5:["TÙ","QUAN"],6:[],7:["TÙ"],8:[],9:["QUAN"] },
  "Thái Ất":   { 1:[],2:[],3:[],4:[],5:[],6:[],7:[],8:[],9:[] },
  "Thiên Ất":  { 1:["TÙ"],2:[],3:["QUAN"],4:["TÙ"],5:["QUAN"],6:[],7:["TÙ"],8:["QUAN"],9:[] },
  "Địa Ất":    { 1:[],2:["QUAN"],3:["TÙ"],4:[],5:["QUAN"],6:["TÙ"],7:[],8:[],9:["QUAN"] },
  "Nhân Ất":   { 1:["QUAN"],2:["TÙ"],3:[],4:[],5:["TÙ"],6:["QUAN"],7:[],8:["TÙ"],9:["QUAN"] },
};

// ── Tính chất Toán ─────────────────────────────────────────────────
const TINH_CHAT_MAP = {
  1:"THUAN_DUONG", 2:"CO_DUONG", 3:"VO_DIA",  4:"VO_THIEN",
  5:"TRUNG_TINH",  6:"CO_AM",    7:"THUAN_AM", 8:"PHAT_AM",
  9:"VONG_AM"
};

// ── Tính số ngày Julius & Can Chi ─────────────────────────────────
function dateToJD(y,m,d){
  const a=Math.floor((14-m)/12);
  const yr=y+4800-a; const mo=m+12*a-3;
  return d+Math.floor((153*mo+2)/5)+365*yr+Math.floor(yr/4)
         -Math.floor(yr/100)+Math.floor(yr/400)-32045;
}

function getCanChi(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const jd = dateToJD(y,m,d);
  // Can từ JD: gốc 2440587 (1 Jan 1970) = Canh (index 6 trong CAN)
  const canIdx = ((jd - 2440587) % 10 + 10) % 10;
  // Chi từ JD: gốc = Thân (index 8)
  const chiIdx = ((jd - 2440587) % 12 + 12) % 12;
  return { can: CAN[canIdx], chi: CHI[chiIdx], canIdx, chiIdx };
}

// ── Core: tính Nhật Cục & Tướng ───────────────────────────────────
function getThaiAtFeatures(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const { can, chi, canIdx, chiIdx } = getCanChi(dateStr);

  // Toán Chủ/Khách dựa trên Can (1-based)
  const canVal = canIdx + 1; // 1..10
  // Chu & Khach tạo từ hàm mô phỏng
  const toan_chu_so   = ((canVal * 3 + chiIdx) % 9) + 1;
  const toan_khach_so = ((canVal * 5 + chiIdx * 2 + 7) % 9) + 1;

  // Tướng: chọn theo tổng hợp ngày
  const jd = dateToJD(y,m,d);
  const tuongIdx = jd % 8; // 0..7 (Thái Ất là trung tâm, 8 tướng xung quanh)
  const tuongNames = Object.keys(AN_PHAT_TABLE);

  const chu_dai   = tuongNames[ tuongIdx % tuongNames.length ];
  const chu_tham  = tuongNames[ (tuongIdx + 2) % tuongNames.length ];
  const khach_dai = tuongNames[ (tuongIdx + 4) % tuongNames.length ];
  const khach_tham= tuongNames[ (tuongIdx + 6) % tuongNames.length ];

  const don_he = canIdx < 5 ? "dương" : "âm";

  function getAnPhat(tuongName, so){
    const tbl = AN_PHAT_TABLE[tuongName] || {};
    return tbl[so] || [];
  }

  return {
    date: dateStr, don_he, can, chi,
    toan_chu:   { so: toan_chu_so,   tinh_chat: TINH_CHAT_MAP[toan_chu_so]   || "" },
    toan_khach: { so: toan_khach_so, tinh_chat: TINH_CHAT_MAP[toan_khach_so] || "" },
    chu_dai_tuong:    { ten: chu_dai,   an_phat: getAnPhat(chu_dai,   toan_chu_so) },
    chu_tham_tuong:   { ten: chu_tham,  an_phat: getAnPhat(chu_tham,  toan_chu_so) },
    khach_dai_tuong:  { ten: khach_dai, an_phat: getAnPhat(khach_dai, toan_khach_so) },
    khach_tham_tuong: { ten: khach_tham,an_phat: getAnPhat(khach_tham,toan_khach_so) },
  };
}

// ══════════════════════════════════════════════════════════════════
//  SIGNAL SCANNER (port từ signal_scanner.py)
// ══════════════════════════════════════════════════════════════════

// Bổ sung "TRUNG_DUONG" vào bộ lọc Bong Bóng
const BONG_BONG = new Set(["THUAN_DUONG","TRUNG_DUONG","CO_DUONG","VO_DIA","VO_THIEN"]);

function scanBTC(data){
  const chu_tham_an   = data.chu_tham_tuong.an_phat;
  const khach_tham_tc = data.toan_khach.tinh_chat;

  if(chu_tham_an.includes("QUAN"))
    return { signal:"🟢 VÀO LỆNH LONG BTC", type:"long",
      reason:"Tướng cơ động phe Bán dính án QUAN (bị khống chế). Nhà cái kẹt thanh khoản xả hàng — giá tự do bứt phá!", score:1 };

  if(BONG_BONG.has(khach_tham_tc))
    return { signal:"🔴 VÀO LỆNH SHORT BTC", type:"short",
      reason:`Đám đông phe Mua rơi vào trạng thái BONG BÓNG (${khach_tham_tc}). Fomo mù quáng mất nền tảng — nhà cái sắp đạp sập hầm!`, score:-1 };

  return { signal:"⬜ ĐỨNG NGOÀI (NO TRADE)", type:"none",
    reason:"Sa bàn giằng co, chưa có tín hiệu nhiễu loạn từ nhà cái.", score:0 };
}

function scanXAU(data){
  const chu_tc       = data.toan_chu.tinh_chat;
  const khach_dai_an = data.khach_dai_tuong.an_phat;

  if(BONG_BONG.has(chu_tc))
    return { signal:"🟢 VÀO LỆNH LONG VÀNG (XAU)", type:"long",
      reason:`Phe Bán dính án BONG BÓNG (${chu_tc}). Lực xả chỉ là tường ảo (Spoofing) cạn kiệt — Vàng sẽ đâm thủng kháng cự!`, score:1 };

  if(khach_dai_an.includes("TÙ"))
    return { signal:"⚠️  ĐỨNG NGOÀI / CÂN NHẮC SHORT NGẮN", type:"short",
      reason:"Tướng Vàng bị án TÙ (bị trói gô, kẹt thanh khoản). Giá đi ngang rỉ máu — Long sẽ bị chôn vốn.", score:-1 };

  return { signal:"⬜ ĐỨNG NGOÀI (NO TRADE)", type:"none",
    reason:"Chưa có tín hiệu bứt phá từ định tinh Vàng.", score:0 };
}

function checkVolTrend(data){
  if(data.toan_khach.so > data.toan_chu.so)
    return { text:"BULLISH (Khách Trường)", cls:"vol-bull" };
  if(data.toan_chu.so > data.toan_khach.so)
    return { text:"BEARISH (Chủ Trường)",  cls:"vol-bear" };
  return { text:"NEUTRAL (Hòa)",          cls:"vol-neut" };
}

// ══════════════════════════════════════════════════════════════════
//  DATE HELPERS
// ══════════════════════════════════════════════════════════════════

function today(){
  const d=new Date();
  return d.toISOString().split('T')[0];
}

function addDays(dateStr,n){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().split('T')[0];
}

function fmtDate(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const names=["CN","T2","T3","T4","T5","T6","T7"];
  const dt=new Date(dateStr+'T00:00:00');
  return `${names[dt.getDay()]} ${d}/${m}/${y}`;
}

// ══════════════════════════════════════════════════════════════════
//  UI RENDER
// ══════════════════════════════════════════════════════════════════

function anChips(arr){
  if(!arr||!arr.length) return '<span style="color:var(--dim)">—</span>';
  return arr.map(a=>`<span class="an-chip">${a}</span>`).join('');
}

function renderCard(dateStr, asset, idx){
  const data = getThaiAtFeatures(dateStr);
  const btcSig = scanBTC(data);
  const xauSig = scanXAU(data);
  const vol    = checkVolTrend(data);

  const showBTC = asset==="BOTH"||asset==="BTC";
  const showXAU = asset==="BOTH"||asset==="XAU";

  const animDelay = `animation-delay:${idx*0.07}s`;

  let btcHtml="", xauHtml="";
  if(showBTC){
    btcHtml=`
    <div class="asset-block">
      <div class="asset-label">₿ BTC / USDT</div>
      <div class="signal-badge signal-${btcSig.type}">${btcSig.signal}</div>
      <div class="signal-reason">${btcSig.reason}</div>
    </div>`;
  }
  if(showXAU){
    xauHtml=`
    <div class="asset-block">
      <div class="asset-label">🥇 XAU / USD</div>
      <div class="signal-badge signal-${xauSig.type}">${xauSig.signal}</div>
      <div class="signal-reason">${xauSig.reason}</div>
    </div>`;
  }

  // If only one asset, no grid split needed
  const bodyStyle = (!showBTC||!showXAU) ? "grid-template-columns:1fr" : "";

  return `
  <div class="day-card" style="${animDelay}">
    <div class="card-header">
      <div class="card-date">${fmtDate(dateStr)}</div>
      <div class="card-can-chi">${data.can} ${data.chi} &nbsp;|&nbsp; ${data.don_he.toUpperCase()} ĐỘN</div>
    </div>
    <div class="card-body" style="${bodyStyle}">
      ${btcHtml}
      ${xauHtml}
    </div>
    <div class="stats-row">
      <div class="stat-pill">Khách: <b>${data.toan_khach.so}</b> [${data.toan_khach.tinh_chat}]</div>
      <div class="stat-pill">Chủ: <b>${data.toan_chu.so}</b> [${data.toan_chu.tinh_chat}]</div>
      <div class="stat-pill ${vol.cls}">Vol: <b>${vol.text}</b></div>
      <div class="stat-pill">Chủ Đại: ${anChips(data.chu_dai_tuong.an_phat)}</div>
      <div class="stat-pill">Chủ Tham: ${anChips(data.chu_tham_tuong.an_phat)}</div>
      <div class="stat-pill">Khách Đại: ${anChips(data.khach_dai_tuong.an_phat)}</div>
      <div class="stat-pill">Khách Tham: ${anChips(data.khach_tham_tuong.an_phat)}</div>
    </div>
  </div>`;
}

// ── Build week chips ───────────────────────────────────────────────
function buildWeekChips(){
  const t = today();
  const chips = document.getElementById('weekChips');
  chips.innerHTML = '';
  for(let i=0;i<7;i++){
    const dt = addDays(t,i);
    const chip = document.createElement('span');
    chip.className = 'week-chip' + (i===0?' active':'');
    chip.textContent = fmtDate(dt);
    chip.dataset.date = dt;
    chip.onclick = function(){
      document.querySelectorAll('.week-chip').forEach(c=>c.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('startDate').value = this.dataset.date;
    };
    chips.appendChild(chip);
  }
}

// ── Main run ──────────────────────────────────────────────────────
function runScan(){
  const startDate = document.getElementById('startDate').value;
  const asset     = document.getElementById('assetSelect').value;
  if(!startDate){ alert('Vui lòng chọn ngày bắt đầu!'); return; }

  document.getElementById('empty').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('results').innerHTML='';

  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    const results=document.getElementById('results');
    let html='';
    for(let i=0;i<7;i++){
      const dt=addDays(startDate,i);
      html+=renderCard(dt,asset,i);
    }
    results.innerHTML=html;
  },200);
}

// ── Init ──────────────────────────────────────────────────────────
(function init(){
  const t=today();
  document.getElementById('startDate').value=t;
  buildWeekChips();
})();
</script>
