<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Radar Thái Ất Quant</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:        #06060e;
  --bg2:       #0c0c1e;
  --gold:      #c8a84b;
  --gold2:     #f0d080;
  --red:       #e05050;
  --green:     #50c878;
  --gray:      #888;
  --border:    rgba(200,168,75,0.25);
  --glow:      rgba(200,168,75,0.15);
  --text:      #d8d0c0;
  --dim:       #7a7060;
}

*{box-sizing:border-box;margin:0;padding:0}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Cosmic BG ── */
body::before {
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(100,60,200,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 85%, rgba(200,120,30,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(20,10,60,0.6) 0%, transparent 100%);
  pointer-events:none;z-index:0;
}

/* Starfield */
.stars {
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,200,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 55%, rgba(255,220,150,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 85%, rgba(200,180,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 8%  50%, rgba(255,255,200,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 33% 5%,  rgba(200,230,255,0.5) 0%, transparent 100%);
}

/* ── Layout ── */
.wrap {
  position:relative;z-index:1;
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

/* ── Header ── */
header {
  text-align:center;
  padding: 2.5rem 0 1.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2.5rem;
  position: relative;
}

.octagram {
  font-size: 2.8rem;
  line-height:1;
  margin-bottom: 0.6rem;
  display:block;
  filter: drop-shadow(0 0 12px var(--gold));
  animation: pulse-glow 3s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%,100%{filter:drop-shadow(0 0 10px var(--gold))}
  50%{filter:drop-shadow(0 0 22px var(--gold2))}
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.3rem, 4vw, 2rem);
  font-weight: 900;
  letter-spacing: .08em;
  background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 50%, #a07830 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  line-height: 1.2;
  margin-bottom: .35rem;
}

.subtitle {
  font-family: 'Share Tech Mono', monospace;
  font-size: .75rem;
  color: var(--dim);
  letter-spacing: .2em;
  text-transform: uppercase;
}

/* ── Control Panel ── */
.controls {
  background: linear-gradient(135deg, rgba(200,168,75,0.06) 0%, rgba(20,15,50,0.5) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 1rem;
  align-items: end;
}

@media(max-width:700px){
  .controls{grid-template-columns:1fr 1fr;}
  .controls .btn-run,.controls .field:nth-child(3){grid-column:1/-1;}
}

.field label {
  display:block;
  font-family:'Share Tech Mono',monospace;
  font-size:.7rem;
  letter-spacing:.15em;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:.5rem;
}

.field select, .field input[type="date"] {
  width:100%;
  background: rgba(10,8,30,0.7);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: .85rem;
  padding: .55rem .8rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

.field select:focus, .field input[type="date"]:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(200,168,75,0.15);
}

.field select option{background:#0c0c1e;}

/* Week range display */
.week-info {
  grid-column: 1/-1;
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}

.week-chip {
  font-family:'Share Tech Mono',monospace;
  font-size:.72rem;
  padding:.28rem .65rem;
  border-radius:20px;
  border:1px solid var(--border);
  background: rgba(200,168,75,0.06);
  color:var(--dim);
  cursor:pointer;
  transition:all .2s;
  white-space:nowrap;
}
.week-chip:hover,.week-chip.active{
  border-color:var(--gold);color:var(--gold);
  background:rgba(200,168,75,0.12);
}

.btn-run {
  background: linear-gradient(135deg, #a07830 0%, var(--gold) 50%, #c8a84b 100%);
  color: #06060e;
  font-family: 'Cinzel Decorative', serif;
  font-size: .8rem;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  padding: .65rem 1.4rem;
  cursor: pointer;
  letter-spacing: .08em;
  transition: transform .15s, box-shadow .15s, filter .2s;
  box-shadow: 0 4px 20px rgba(200,168,75,0.35);
  white-space:nowrap;
}
.btn-run:hover{transform:translateY(-2px);box-shadow:0 7px 28px rgba(200,168,75,0.5);filter:brightness(1.1)}
.btn-run:active{transform:translateY(0)}

/* ── Results ── */
#results { display:flex; flex-direction:column; gap:1.4rem; }

.day-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(12,10,35,0.85) 0%, rgba(8,6,20,0.9) 100%);
  overflow: hidden;
  animation: fadeUp .35s ease both;
  transition: box-shadow .3s;
}
.day-card:hover{box-shadow:0 0 30px rgba(200,168,75,0.1)}

@keyframes fadeUp {
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.card-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: rgba(200,168,75,0.06);
  border-bottom: 1px solid var(--border);
}

.card-date {
  font-family: 'Cinzel Decorative', serif;
  font-size: .95rem;
  color: var(--gold);
  flex:1;
}
.card-can-chi {
  font-family:'Share Tech Mono',monospace;
  font-size:.72rem;
  color:var(--dim);
  letter-spacing:.1em;
}

.card-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

@media(max-width:580px){.card-body{grid-template-columns:1fr;}}

.asset-block {
  padding: 1.1rem 1.25rem;
}
.asset-block:first-child{border-right:1px solid var(--border);}

.asset-label {
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;
  letter-spacing:.2em;
  color:var(--dim);
  text-transform:uppercase;
  margin-bottom:.5rem;
}

.signal-badge {
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  font-size:.82rem;
  font-weight:600;
  font-family:'Share Tech Mono',monospace;
  padding:.3rem .7rem;
  border-radius:5px;
  margin-bottom:.55rem;
  letter-spacing:.05em;
}
.signal-long  {background:rgba(80,200,120,0.15);color:var(--green);border:1px solid rgba(80,200,120,0.3)}
.signal-short {background:rgba(224,80,80,0.15);color:var(--red);border:1px solid rgba(224,80,80,0.25)}
.signal-none  {background:rgba(100,100,100,0.1);color:var(--gray);border:1px solid rgba(100,100,100,0.2)}

.signal-reason {
  font-size:.75rem;
  color:#9090a0;
  line-height:1.5;
}

/* Stats row */
.stats-row {
  display:flex;
  gap:.4rem;
  flex-wrap:wrap;
  padding: .75rem 1.25rem;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}

.stat-pill {
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;
  color:var(--dim);
  padding:.18rem .55rem;
  border:1px solid rgba(200,168,75,0.12);
  border-radius:3px;
  background:rgba(200,168,75,0.04);
}
.stat-pill b{color:var(--gold);}

/* An phat chips */
.an-chip {
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:.6rem;
  padding:.12rem .4rem;
  border-radius:3px;
  margin:.1rem;
  background:rgba(224,80,80,0.12);
  color:#e07070;
  border:1px solid rgba(224,80,80,0.2);
}

/* Volume badge */
.vol-bull{color:var(--green)} .vol-bear{color:var(--red)} .vol-neut{color:var(--gray)}

/* Loading */
#loading {
  text-align:center;
  padding:2rem;
  font-family:'Share Tech Mono',monospace;
  color:var(--dim);
  font-size:.85rem;
  display:none;
}
.spinner {
  width:28px;height:28px;
  border:2px solid rgba(200,168,75,0.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto .8rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
#empty {
  text-align:center;
  padding:3rem 1rem;
  color:var(--dim);
  font-family:'Share Tech Mono',monospace;
  font-size:.8rem;
  letter-spacing:.1em;
}
.empty-icon{font-size:2.5rem;margin-bottom:.8rem;opacity:.4;}

/* Footer */
footer{
  text-align:center;
  margin-top:3rem;
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;
  color:var(--dim);
  letter-spacing:.15em;
  border-top:1px solid var(--border);
  padding-top:1.5rem;
}
</style>
</head>
<body>
<div class="stars"></div>

<div class="wrap">

<!-- HEADER -->
<header>
  <span class="octagram">☯</span>
  <h1>Radar Thái Ất Quant</h1>
  <p class="subtitle">BTC · XAU · USD/JPY &nbsp;|&nbsp; Signal Scanner &nbsp;|&nbsp; Nhật Cục</p>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="field">
    <label>📅 Từ ngày</label>
    <input type="date" id="startDate"/>
  </div>
  <div class="field">
    <label>📅 Đến ngày</label>
    <input type="date" id="endDate"/>
  </div>
  <div class="field">
    <label>🎯 Tài sản</label>
    <select id="assetSelect">
      <option value="BOTH">BTC + XAU</option>
      <option value="BTC">BTC only</option>
      <option value="XAU">XAU only</option>
      <option value="USDJPY">USD/JPY only</option>
      <option value="ALL">BTC + XAU + USD/JPY</option>
    </select>
  </div>
  <button class="btn-run" onclick="runScan()">QUÉT KÈO ▶</button>

  <div class="week-info" id="rangeChips">
    <span class="week-chip" data-range="today">Hôm nay</span>
    <span class="week-chip active" data-range="week">7 ngày tới</span>
    <span class="week-chip" data-range="2week">14 ngày tới</span>
    <span class="week-chip" data-range="month">30 ngày tới</span>
    <span class="week-chip" data-range="custom">Tùy chỉnh</span>
  </div>
</div>

<!-- Nút Xuất Báo Cáo — nằm TRÊN kết quả, chỉ hiện sau khi đã quét -->
<div id="exportBtnWrap" style="display:none;text-align:center;margin-bottom:1.2rem;">
  <button onclick="exportReport()" style="font-family:'Cinzel Decorative',serif;font-size:.78rem;font-weight:700;background:linear-gradient(135deg,rgba(200,168,75,0.15) 0%,rgba(200,168,75,0.08) 100%);border:1px solid var(--gold);color:var(--gold);padding:.65rem 2rem;border-radius:8px;cursor:pointer;letter-spacing:.08em;transition:all .2s;box-shadow:0 0 18px rgba(200,168,75,0.1);" onmouseover="this.style.background='rgba(200,168,75,0.22)'" onmouseout="this.style.background='linear-gradient(135deg,rgba(200,168,75,0.15) 0%,rgba(200,168,75,0.08) 100%)'">📋 XUẤT BÁO CÁO</button>
</div>

<!-- REPORT BOX — nằm TRÊN kết quả -->
<div id="reportWrap" style="display:none;margin-bottom:2rem;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;">
    <span style="font-family:'Share Tech Mono',monospace;font-size:.75rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;">📋 Báo Cáo Tín Hiệu</span>
    <div style="display:flex;gap:.5rem;align-items:center;">
      <button onclick="copyReport()" id="copyBtn" style="font-family:'Share Tech Mono',monospace;font-size:.72rem;background:rgba(200,168,75,0.12);border:1px solid var(--border);color:var(--gold);padding:.3rem .9rem;border-radius:5px;cursor:pointer;transition:all .2s;">⧉ COPY</button>
      <button onclick="closeReport()" style="font-family:'Share Tech Mono',monospace;font-size:.72rem;background:rgba(100,100,100,0.1);border:1px solid rgba(100,100,100,0.3);color:var(--gray);padding:.3rem .7rem;border-radius:5px;cursor:pointer;transition:all .2s;">✕</button>
    </div>
  </div>
  <textarea id="reportBox" readonly
    style="width:100%;min-height:220px;background:rgba(6,6,14,0.9);border:1px solid var(--border);border-radius:8px;color:#b0c0a0;font-family:'Share Tech Mono',monospace;font-size:.72rem;line-height:1.7;padding:1rem;resize:vertical;outline:none;"></textarea>
</div>

<!-- RESULTS -->
<div id="loading"><div class="spinner"></div>Đang giải sa bàn...</div>
<div id="empty">
  <div class="empty-icon">☰</div>
  Chọn khoảng thời gian và nhấn QUÉT KÈO để bắt đầu
</div>
<div id="results"></div>

<footer>THÁI ẤT QUANT &nbsp;·&nbsp; DỰA TRÊN THUẬT TOÁN NHẬT CỤC &nbsp;·&nbsp; KHÔNG PHẢI TƯ VẤN ĐẦU TƯ</footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   THAI ẤT CORE — Port 1-to-1 từ thai_at_core.py
   ══════════════════════════════════════════════════════════════════ */

// ── Bảng dữ liệu cố định ──────────────────────────────────────────
const THAN_INFO = {
  "Tuất":[1,"1st"],"Càn":[1,"2nd"],"Hợi":[1,"3rd"],
  "Sửu": [3,"1st"],"Cấn":[3,"2nd"],"Dần":[3,"3rd"],
  "Thìn":[9,"1st"],"Tốn":[9,"2nd"],"Tỵ": [9,"3rd"],
  "Mùi": [7,"1st"],"Khôn":[7,"2nd"],"Thân":[7,"3rd"],
  "Tý":  [8,"2nd"],
  "Mão": [4,"2nd"],
  "Ngọ": [2,"2nd"],
  "Dậu": [6,"2nd"],
};

const LAC_THU      = [1,8,3,4,9,2,7,6];
const MAP_CUNG_IDX = {1:0,8:1,3:2,4:3,9:4,2:5,7:6,6:7};
const VONG_BAT_QUAI= [1,8,3,4,9,2,7,6];
const DUONG_PALACES = [1,2,3,4,6,7,8,9];
const DIA_BAN = ["Càn","Hợi","Tý","Sửu","Cấn","Dần","Mão","Thìn",
                 "Tốn","Tỵ","Ngọ","Mùi","Khôn","Thân","Dậu","Tuất"];

// Văn Xương map
const MAP_VX_DUONG = {1:"Thân",2:"Dậu",3:"Tuất",4:"Càn",5:"Càn",6:"Hợi",
  7:"Tý",8:"Sửu",9:"Cấn",10:"Dần",11:"Mão",12:"Thìn",
  13:"Tốn",14:"Tỵ",15:"Ngọ",16:"Mùi",17:"Khôn",0:"Khôn"};
const MAP_KT_DUONG = {1:"Dần",2:"Sửu",3:"Tý",4:"Hợi",5:"Tuất",6:"Dậu",
  7:"Thân",8:"Mùi",9:"Ngọ",10:"Tỵ",11:"Thìn",0:"Mão"};
const MAP_VX_AM = {1:"Dần",2:"Mão",3:"Thìn",4:"Tốn",5:"Tốn",6:"Tỵ",
  7:"Ngọ",8:"Mùi",9:"Khôn",10:"Thân",11:"Dậu",12:"Tuất",
  13:"Càn",14:"Hợi",15:"Tý",16:"Sửu",17:"Cấn",0:"Cấn"};
const MAP_KT_AM = {1:"Thân",2:"Mùi",3:"Ngọ",4:"Tỵ",5:"Thìn",6:"Mão",
  7:"Dần",8:"Sửu",9:"Tý",10:"Hợi",11:"Tuất",0:"Dậu"};

// Can Chi (cho hiển thị)
const CAN = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
const CHI = ["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];

// ── Hàm tiện ích ──────────────────────────────────────────────────
function modPos(a,b){ return ((a%b)+b)%b; }

function toJDN(y,m,d){
  const a=(14-m)>>2>>0 || Math.floor((14-m)/12);
  // dùng công thức gốc Python
  const aa=Math.floor((14-m)/12);
  const yy=y+4800-aa; const mm=m+12*aa-3;
  return d+Math.floor((153*mm+2)/5)+365*yy
    +Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
}

function dayOfYear(y,m,d){
  const start=new Date(y,0,0);
  const cur=new Date(y,m-1,d);
  return Math.round((cur-start)/86400000);
}

// ── Khoảng cách không gian Bát Quái ──────────────────────────────
function khoangCach(c1,c2){
  const i1=VONG_BAT_QUAI.indexOf(c1);
  const i2=VONG_BAT_QUAI.indexOf(c2);
  if(i1<0||i2<0) return 99;
  const d=Math.abs(i1-i2);
  return Math.min(d,8-d);
}

// ── Đếm quân ─────────────────────────────────────────────────────
function demQuan(startThan, taPalace){
  const [cungStart, loaiThan] = THAN_INFO[startThan];
  if(cungStart===taPalace) return cungStart;
  let idx    = MAP_CUNG_IDX[cungStart];
  const taIdx= MAP_CUNG_IDX[taPalace];
  let total  = 0;
  if(loaiThan==="1st"||loaiThan==="3rd"){
    total+=1;
    if(loaiThan==="1st") total+=LAC_THU[idx];
  } else {
    total+=LAC_THU[idx];
  }
  idx=(idx+1)%8;
  while(idx!==taIdx){ total+=LAC_THU[idx]; idx=(idx+1)%8; }
  return total;
}

// ── Tính Tướng ────────────────────────────────────────────────────
function tinhTuong(toan){
  const dai  = toan%10 || 1;
  const tham = (dai*3)%10 || 1;
  return [dai,tham];
}

// ── Tính chất Toán số ─────────────────────────────────────────────
function layTinhChat(toanSo){
  const v = (toanSo%40)||40;
  if(v===33||v===39)              return "THUAN_DUONG";
  if(v===22||v===26)              return "THUAN_AM";
  if(v===10||v===30)              return "CO_DUONG";
  if(v===20||v===40)              return "CO_AM";
  if([1,3,5,7,9].includes(v))    return "DON_DUONG";
  if([2,4,6,8].includes(v))      return "DON_AM";
  if([14,18,23].includes(v))     return "THUONG_HOA";
  if(v===29||v===36)             return "THU_HOA";
  if([12,16,27,34,38].includes(v))return "HA_HOA";
  if([16,17,18,19,26,27,28,29,36,37,38,39].includes(v)) return "TAM_TAI";
  if([13,19,31,37].includes(v))  return "TAP_TRUNG_DUONG";
  if(v===24||v===28)             return "TAP_TRUNG_AM";
  if(v===11||v===17)             return "DUONG_TRONG_AM";
  if(v%10>=1&&v%10<=4)           return "VO_DIA";
  return "BINH_THUONG";
}

// ── Giải phẫu án Tướng ───────────────────────────────────────────
function giaiPhauAn(cungTuong, thaiAt, vanXuong, thuyKich,
                    dichDai, dichTham, toanSo){
  const cungVX = THAN_INFO[vanXuong][0];
  const cungTK = THAN_INFO[thuyKich][0];
  const tinhChat = layTinhChat(toanSo);
  const anHung = [];

  if(cungTuong===5)       anHung.push("ĐỖ");
  if(cungTuong===thaiAt)  anHung.push("TÙ");
  if(cungTuong===cungVX)  anHung.push("QUAN");
  if(cungTuong===cungTK)  anHung.push("YỂM");

  const kcTA = khoangCach(cungTuong,thaiAt);
  if(kcTA===4) anHung.push("CÁCH");
  else if(kcTA===1) anHung.push("BÁCH");

  const kcDD  = khoangCach(cungTuong,dichDai);
  const kcDT  = khoangCach(cungTuong,dichTham);
  const kcDDTA= khoangCach(dichDai,thaiAt);
  const kcDDDT= khoangCach(dichDai,dichTham);

  if(kcDD===1&&kcDT===1&&kcDDDT===2) anHung.push("HIỆP");
  if(kcDD===1&&kcTA===1&&kcDDTA===2) anHung.push("ĐỀ");

  if(anHung.length>0){
    return { status:"hung", an_phat: anHung };
  }

  // Không có án không gian → xét tính chất toán
  const yeuKem  = ["DON","CO","VO_DIA"];
  const cucDoan = ["THUAN_DUONG","THUAN_AM"];
  if(yeuKem.some(k=>tinhChat.includes(k))){
    return { status:"binh", an_phat:["HƯU"] };
  }
  if(cucDoan.some(k=>tinhChat.includes(k))){
    return { status:"binh", an_phat:["BONG_BÓNG"] };
  }
  return { status:"cat", an_phat:["PHÁT"] };
}

// ── Tính một Cục ─────────────────────────────────────────────────
function tinhCuc(tichSo, cucSo, donHe){
  const idxTA = Math.floor(((cucSo-1)%24)/3);
  const thaiAt= DUONG_PALACES[idxTA];

  const mapVX = donHe==="duong" ? MAP_VX_DUONG : MAP_VX_AM;
  const mapKT = donHe==="duong" ? MAP_KT_DUONG : MAP_KT_AM;

  const vanXuong = mapVX[tichSo%18];
  const keThan   = mapKT[tichSo%12];

  const idxVX   = DIA_BAN.indexOf(vanXuong);
  const idxKT   = DIA_BAN.indexOf(keThan);
  const thuyKich= DIA_BAN[(4+modPos(idxVX-idxKT,16))%16];

  const toanChu   = demQuan(vanXuong,thaiAt);
  const toanKhach = demQuan(thuyKich,thaiAt);

  const [chuDai,  chuTham  ] = tinhTuong(toanChu);
  const [khachDai,khachTham] = tinhTuong(toanKhach);

  const anChuDai    = giaiPhauAn(chuDai,   thaiAt,vanXuong,thuyKich, khachDai,khachTham, toanChu);
  const anChuTham   = giaiPhauAn(chuTham,  thaiAt,vanXuong,thuyKich, khachDai,khachTham, toanChu);
  const anKhachDai  = giaiPhauAn(khachDai, thaiAt,vanXuong,thuyKich, chuDai,  chuTham,   toanKhach);
  const anKhachTham = giaiPhauAn(khachTham,thaiAt,vanXuong,thuyKich, chuDai,  chuTham,   toanKhach);

  return {
    thaiAt, vanXuong, keThan, thuyKich,
    toanChu, toanKhach,
    toanChuTinhChat:   layTinhChat(toanChu),
    toanKhachTinhChat: layTinhChat(toanKhach),
    chuDaiTuong:   { cung:chuDai,   an_phat:anChuDai.an_phat,   status:anChuDai.status },
    chuThamTuong:  { cung:chuTham,  an_phat:anChuTham.an_phat,  status:anChuTham.status },
    khachDaiTuong: { cung:khachDai, an_phat:anKhachDai.an_phat, status:anKhachDai.status },
    khachThamTuong:{ cung:khachTham,an_phat:anKhachTham.an_phat,status:anKhachTham.status },
  };
}

// ── Hàm chính: compute() ─────────────────────────────────────────
function compute(y,m,d){
  // Tích số Năm
  const tichSoNam  = 10155509+(y-1592);
  const tueCuc     = ((tichSoNam%3600)%72)||72;

  // Tích số Tháng
  const tichSoThang= (tichSoNam-1)*12+(m+2);
  const nguyetCuc  = ((tichSoThang%3600)%72)||72;

  // Tích số Ngày
  const jdn        = toJDN(y,m,d);
  const tichSoNgay = jdn+50;
  const nhatCuc    = tichSoNgay%72||72;

  // Âm/Dương Độn theo ngày trong năm
  const doy   = dayOfYear(y,m,d);
  const donHe = (doy>=172&&doy<=355)?"am":"duong";

  // Tính Nhật Cục (D1 chính)
  const nc = tinhCuc(tichSoNgay, nhatCuc, donHe);

  // Can Chi để hiển thị
  const canIdx = modPos(jdn-2440587,10);
  const chiIdx = modPos(jdn-2440587,12);

  return { nc, donHe, canIdx, chiIdx, doy };
}

// ── getThaiAtFeatures() — interface với UI ────────────────────────
function getThaiAtFeatures(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const { nc, donHe, canIdx, chiIdx } = compute(y,m,d);

  return {
    date: dateStr,
    don_he: donHe,
    can: CAN[canIdx],
    chi: CHI[chiIdx],
    toan_chu:   { so: nc.toanChu,   tinh_chat: nc.toanChuTinhChat },
    toan_khach: { so: nc.toanKhach, tinh_chat: nc.toanKhachTinhChat },
    chu_dai_tuong:    { ten:`Cung ${nc.chuDaiTuong.cung}`,   an_phat: nc.chuDaiTuong.an_phat },
    chu_tham_tuong:   { ten:`Cung ${nc.chuThamTuong.cung}`,  an_phat: nc.chuThamTuong.an_phat },
    khach_dai_tuong:  { ten:`Cung ${nc.khachDaiTuong.cung}`, an_phat: nc.khachDaiTuong.an_phat },
    khach_tham_tuong: { ten:`Cung ${nc.khachThamTuong.cung}`,an_phat: nc.khachThamTuong.an_phat },
  };
}

function todayStr(){
  // Dùng local date, tránh timezone UTC lệch ngày
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd= String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd= String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const names = ["CN","T2","T3","T4","T5","T6","T7"];
  const dt = new Date(dateStr+'T00:00:00');
  return `${names[dt.getDay()]} ${d}/${m}/${y}`;
}

function isWeekend(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  return dt.getDay()===0 || dt.getDay()===6; // CN=0, T7=6
}

// Sinh danh sách ngày trong khoảng [start, end], lọc T7/CN cho XAU và USDJPY
function buildDateList(startStr, endStr, asset){
  const list = [];
  let cur = startStr;
  const MAX = 366;
  let i = 0;
  while(cur <= endStr && i < MAX){
    const wknd = isWeekend(cur);
    // XAU only hoặc USDJPY only: bỏ T7, CN
    if((asset==='XAU' || asset==='USDJPY') && wknd){
      cur = addDays(cur, 1); i++; continue;
    }
    list.push(cur);
    cur = addDays(cur, 1); i++;
  }
  return list;
}

    const jpySig  = scanUSDJPY(data);
    const weekend = isWeekend(dt);
    const xauSig  = (!weekend || asset==="BTC"||asset==="USDJPY") ? scanXAU(data) : null;

    const hasBTC = (asset!=="XAU"&&asset!=="USDJPY") && btcSig.score !== 0;
    const hasXAU = (asset!=="BTC"&&asset!=="USDJPY") && !weekend && xauSig && xauSig.score !== 0;
    const hasJPY = (asset==="USDJPY"||asset==="ALL") && jpySig.score !== 0;

    if(!hasBTC && !hasXAU && !hasJPY) {
      if(asset!=="XAU"&&asset!=="USDJPY"){ if(btcSig.type==="long") btcLong++; if(btcSig.type==="short") btcShort++; }
      if(asset==="USDJPY"||asset==="ALL"){ if(jpySig.type==="long") jpyLong++; }
      continue;
    }

    signalDays++;
    lines.push(`──────────────────────────────────────────────────`);
    lines.push(`📅 ${fmtDate(dt)}  |  ${data.can} ${data.chi}  |  ${data.don_he.toUpperCase()} ĐỘN`);
    lines.push(`   Án: ChuDai=${data.chu_dai_tuong.an_phat.join(',')||'—'}  ChuTham=${data.chu_tham_tuong.an_phat.join(',')||'—'}  KhachDai=${data.khach_dai_tuong.an_phat.join(',')||'—'}  KhachTham=${data.khach_tham_tuong.an_phat.join(',')||'—'}`);

    if(hasBTC){
      lines.push(`   ₿ BTC    : ${btcSig.signal}`);
      lines.push(`              → ${btcSig.reason}`);
      if(btcSig.type==="long") btcLong++;
      if(btcSig.type==="short") btcShort++;
    }
    if(hasXAU){
      lines.push(`   🥇 XAU   : ${xauSig.signal}`);
      lines.push(`              → ${xauSig.reason}`);
      if(xauSig.type==="long") xauLong++;
      if(xauSig.score===-0.5) xauWarn++;
    }
    if(hasJPY){
      lines.push(`   💴 USD/JPY: ${jpySig.signal}  [Score: +${jpySig.score}]`);
      lines.push(`              → ${jpySig.reason}`);
      if(jpySig.type==="long") jpyLong++;
    }
    lines.push("");
  }

  if(signalDays === 0){
    lines.push("  (Không có ngày nào phát sinh tín hiệu giao dịch)");
    lines.push("");
  }

  lines.push("══════════════════════════════════════════════════");
  lines.push(`  TÓM TẮT: ${signalDays} ngày có tín hiệu / ${dateList.length} ngày quét`);
  if(asset!=="XAU"&&asset!=="USDJPY") lines.push(`  BTC     — LONG: ${btcLong} ngày  |  SHORT: ${btcShort} ngày`);
  if(asset!=="BTC"&&asset!=="USDJPY") lines.push(`  XAU     — LONG: ${xauLong} ngày  |  HẠ TỶ TRỌNG: ${xauWarn} ngày`);
  if(asset==="USDJPY"||asset==="ALL") lines.push(`  USD/JPY — LONG: ${jpyLong} ngày`);
  lines.push("══════════════════════════════════════════════════");

  return lines.join("\n");
}

function copyReport(){
  const box = document.getElementById('reportBox');
  box.select(); box.setSelectionRange(0,99999);
  navigator.clipboard.writeText(box.value).then(()=>{
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ ĐÃ COPY';
    btn.style.color = 'var(--green)';
    setTimeout(()=>{ btn.textContent='⧉ COPY'; btn.style.color='var(--gold)'; }, 2000);
  }).catch(()=>{
    document.execCommand('copy');
  });
}

// ══════════════════════════════════════════════════════════════════
//  RANGE CHIP LOGIC
// ══════════════════════════════════════════════════════════════════

function setRange(start, end){
  document.getElementById('startDate').value = start;
  document.getElementById('endDate').value   = end;
}

function initRangeChips(){
  const t = todayStr();
  document.querySelectorAll('#rangeChips .week-chip').forEach(chip=>{
    chip.onclick = function(){
      document.querySelectorAll('#rangeChips .week-chip').forEach(c=>c.classList.remove('active'));
      this.classList.add('active');
      const r = this.dataset.range;
      if(r==='today')  setRange(t, t);
      if(r==='week')   setRange(t, addDays(t,6));
      if(r==='2week')  setRange(t, addDays(t,13));
      if(r==='month')  setRange(t, addDays(t,29));
      if(r==='custom') {/* user chỉnh tay */}
    };
  });
}

// ── Main run ──────────────────────────────────────────────────────
function runScan(){
  const startDate = document.getElementById('startDate').value;
  const endDate   = document.getElementById('endDate').value;
  const asset     = document.getElementById('assetSelect').value;

  if(!startDate||!endDate){ alert('Vui lòng chọn đủ ngày bắt đầu và kết thúc!'); return; }
  if(startDate > endDate){ alert('Ngày bắt đầu phải nhỏ hơn hoặc bằng ngày kết thúc!'); return; }

  document.getElementById('empty').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('results').innerHTML='';
  document.getElementById('reportWrap').style.display='none';
  document.getElementById('exportBtnWrap').style.display='none';

  setTimeout(()=>{
    document.getElementById('loading').style.display='none';

    const dateList = buildDateList(startDate, endDate, asset);

    if(dateList.length===0){
      document.getElementById('empty').style.display='block';
      document.getElementById('empty').querySelector('.empty-icon').textContent='🔒';
      document.getElementById('empty').querySelector('div:last-child') && (document.getElementById('empty').innerHTML='<div class="empty-icon">🔒</div>Không có ngày giao dịch trong khoảng này (XAU đóng cửa T7, CN).');
      return;
    }

    const results = document.getElementById('results');
    let html = '';
    dateList.forEach((dt,i)=>{ html += renderCard(dt, asset, i); });
    results.innerHTML = html;

    // Lưu lại để dùng khi user bấm Xuất Báo Cáo
    window._lastDateList = dateList;
    window._lastAsset    = asset;
    document.getElementById('exportBtnWrap').style.display='block';
    document.getElementById('reportWrap').style.display='none';

  }, 200);
}

function exportReport(){
  const dateList = window._lastDateList;
  const asset    = window._lastAsset;
  if(!dateList||!dateList.length){ alert('Chưa có dữ liệu — hãy quét kèo trước!'); return; }
  const report = buildReport(dateList, asset);
  document.getElementById('reportBox').value = report;
  document.getElementById('reportWrap').style.display='block';
  // Scroll lên reportWrap (nằm trên results)
  document.getElementById('reportWrap').scrollIntoView({ behavior:'smooth', block:'start' });
}

function closeReport(){
  document.getElementById('reportWrap').style.display='none';
}

// ── Init ──────────────────────────────────────────────────────────
(function init(){
  const t = todayStr();
  document.getElementById('startDate').value = t;
  document.getElementById('endDate').value   = addDays(t, 6);
  initRangeChips();
  // Auto-run ngay khi mở app
  runScan();
})();
</script>
